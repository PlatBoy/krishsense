<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrishiSense</title>
    <style>
      .krishsense-language-control {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 99999;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .krishsense-language-button {
        height: 40px;
        min-width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 11px;
        border: 1px solid rgba(255,255,255,.28);
        border-radius: 12px;
        background: rgba(255,255,255,.96);
        color: #173b25;
        box-shadow: 0 4px 14px rgba(0,0,0,.12);
        font: 700 13px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
        transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .krishsense-language-button:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 18px rgba(0,0,0,.16);
        background: #fff;
      }
      .krishsense-language-button:focus-visible {
        outline: 2px solid #78a982;
        outline-offset: 2px;
      }
      .krishsense-language-globe { font-size: 17px; line-height: 1; }
      .krishsense-language-code { letter-spacing: .02em; }
      .krishsense-language-chevron {
        width: 7px;
        height: 7px;
        border-right: 2px solid currentColor;
        border-bottom: 2px solid currentColor;
        transform: rotate(45deg) translateY(-2px);
        margin-left: 2px;
      }
      .krishsense-language-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 190px;
        max-height: 360px;
        overflow-y: auto;
        padding: 6px;
        border: 1px solid rgba(33,102,58,.12);
        border-radius: 14px;
        background: rgba(255,255,255,.98);
        box-shadow: 0 12px 30px rgba(20,50,30,.18);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-5px) scale(.98);
        transform-origin: top right;
        transition: opacity .15s ease, transform .15s ease, visibility .15s ease;
      }
      .krishsense-language-menu.open {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }
      .krishsense-language-option {
        width: 100%;
        min-height: 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #24442e;
        text-align: left;
        font: 600 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        cursor: pointer;
      }
      .krishsense-language-option:hover { background: #eef7ef; }
      .krishsense-language-option.active { background: #e5f1e7; color: #174d29; }
      .krishsense-language-check { opacity: 0; font-size: 14px; }
      .krishsense-language-option.active .krishsense-language-check { opacity: 1; }
      #google_translate_element {
        position: fixed !important;
        left: -10000px !important;
        top: -10000px !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
      }
      .goog-te-banner-frame.skiptranslate { display: none !important; }
      body { top: 0 !important; }
      @media (max-width: 700px) {
        .krishsense-language-control { top: 10px; right: 10px; }
        .krishsense-language-menu { width: 180px; }
      }
    </style>
  </head>
  <body>
    <div class="krishsense-language-control" id="krishsense-language-control">
      <button class="krishsense-language-button" id="krishsense-language-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Choose language">
        <span class="krishsense-language-globe" aria-hidden="true">🌐</span>
        <span class="krishsense-language-code" id="krishsense-language-code">EN</span>
        <span class="krishsense-language-chevron" aria-hidden="true"></span>
      </button>
      <div class="krishsense-language-menu" id="krishsense-language-menu" role="menu" aria-label="Languages">
        <button class="krishsense-language-option active" data-language="en" role="menuitem" type="button"><span>English</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="hi" role="menuitem" type="button"><span>हिन्दी</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="pa" role="menuitem" type="button"><span>ਪੰਜਾਬੀ</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="mr" role="menuitem" type="button"><span>मराठी</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="bn" role="menuitem" type="button"><span>বাংলা</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="gu" role="menuitem" type="button"><span>ગુજરાતી</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="ta" role="menuitem" type="button"><span>தமிழ்</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="te" role="menuitem" type="button"><span>తెలుగు</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="kn" role="menuitem" type="button"><span>ಕನ್ನಡ</span><span class="krishsense-language-check">✓</span></button>
        <button class="krishsense-language-option" data-language="ml" role="menuitem" type="button"><span>മലയാളം</span><span class="krishsense-language-check">✓</span></button>
      </div>
    </div>

    <div id="google_translate_element" aria-hidden="true"></div>
    <div id="root"></div>

    <script>
      (function () {
        var control = document.getElementById('krishsense-language-control');
        var button = document.getElementById('krishsense-language-button');
        var menu = document.getElementById('krishsense-language-menu');
        var code = document.getElementById('krishsense-language-code');
        var options = Array.from(document.querySelectorAll('.krishsense-language-option'));
        var languageCodes = { en: 'EN', hi: 'HI', pa: 'PA', mr: 'MR', bn: 'BN', gu: 'GU', ta: 'TA', te: 'TE', kn: 'KN', ml: 'ML' };

        function getSavedLanguage() {
          var match = document.cookie.match(/(?:^|;\s*)googtrans=([^;]+)/);
          if (!match) return 'en';
          try {
            var parts = decodeURIComponent(match[1]).split('/');
            return parts[parts.length - 1] || 'en';
          } catch (_) { return 'en'; }
        }

        function setGoogleLanguage(language) {
          var combo = document.querySelector('.goog-te-combo');
          if (!combo) return false;
          combo.value = language;
          combo.dispatchEvent(new Event('change', { bubbles: true }));
          return true;
        }

        function clearGoogleLanguageCookies() {
          var hostname = location.hostname;
          document.cookie = 'googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
          document.cookie = 'googtrans=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=' + hostname;
        }

        function closeMenu() {
          menu.classList.remove('open');
          button.setAttribute('aria-expanded', 'false');
        }

        function updateActive(language) {
          code.textContent = languageCodes[language] || 'EN';
          options.forEach(function (option) {
            option.classList.toggle('active', option.dataset.language === language);
          });
        }

        function applyLanguage(language) {
          updateActive(language);
          closeMenu();

          if (language === 'en') {
            clearGoogleLanguageCookies();
            window.location.reload();
            return;
          }

          document.cookie = 'googtrans=/en/' + language + ';path=/;SameSite=Lax';
          var attempts = 0;
          function tryApply() {
            if (setGoogleLanguage(language)) return;
            attempts += 1;
            if (attempts < 40) window.setTimeout(tryApply, 200);
          }
          tryApply();
        }

        var saved = getSavedLanguage();
        if (!languageCodes[saved]) saved = 'en';
        updateActive(saved);

        button.addEventListener('click', function () {
          var isOpen = menu.classList.toggle('open');
          button.setAttribute('aria-expanded', String(isOpen));
        });

        options.forEach(function (option) {
          option.addEventListener('click', function () { applyLanguage(option.dataset.language); });
        });

        document.addEventListener('click', function (event) {
          if (!control.contains(event.target)) closeMenu();
        });

        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape') closeMenu();
        });

        window.googleTranslateElementInit = function () {
          if (!window.google || !window.google.translate) return;
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,pa,mr,bn,gu,ta,te,kn,ml',
            autoDisplay: false
          }, 'google_translate_element');
          if (saved !== 'en') window.setTimeout(function () { setGoogleLanguage(saved); }, 600);
        };
      })();
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
